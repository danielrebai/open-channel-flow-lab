<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;font-family:system-ui,-apple-system,sans-serif;color:#415469}
svg{width:100%;max-width:1100px;display:block;margin:auto;touch-action:none;user-select:none;overflow:hidden}
.handle{fill:#fff9e9;stroke:#85542d;stroke-width:4;cursor:ns-resize;filter:drop-shadow(0 2px 3px #0004)}
.head-handle{fill:#e6f6ff;stroke:#168bc4;stroke-width:4;cursor:ns-resize;filter:drop-shadow(0 2px 3px #0004)}
text{font-family:system-ui,-apple-system,sans-serif}.tag{font-size:16px;font-weight:850;paint-order:stroke;stroke:#f1fbff;stroke-width:4px}.note{font-size:12px;fill:#718096}.slope-label{font-size:17px;fill:#34536c;font-weight:850;letter-spacing:1.3px}
</style></head><body>
<svg id="scene" viewBox="0 0 980 545" aria-label="Interactive reservoir and channel with draggable head and slope"></svg>
<script>
'use strict';
const svg=document.getElementById('scene'),NS='http://www.w3.org/2000/svg';
let args={},active=null,revision=0,localH=2.4,localS=.0015;
const XL=42,XA=186,XI=278,XR=936,YTOP=42,YBOTTOM=440;
function send(type,data={}){parent.postMessage({isStreamlitMessage:true,type,...data},'*')}
function el(tag,attr={},txt){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attr))n.setAttribute(k,v);if(txt!==undefined)n.textContent=txt;svg.appendChild(n);return n}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function xpix(x){return XI+x/90*(XR-XI)}
function fmt(x,n=3){return Number(x).toFixed(n)}
function draw(){
 svg.replaceChildren();
 el('rect',{x:8,y:8,width:964,height:524,rx:18,fill:'#eaf5f9','fill-opacity':'.35',stroke:'#b6cbd3','stroke-width':1.5});
 const sol=args.solution||null,H=localH,s=localS;
 // A fixed visual exaggeration makes mild and steep slopes equally draggable.
 const bedDrop=18+102*Math.log10(s/.00005)/Math.log10(800);
 const base=306,headScale=52;
 const bedY=x=>base+bedDrop*(x/90);
 const waterY=base-H*headScale;
 const maxY=YBOTTOM;
 el('rect',{x:XA,y:YTOP,width:XI-XA,height:maxY-YTOP,fill:'#168bc4',opacity:'.12'});
 // Ground area, matching the filled channel-bed style of Module 05.
 // Reservoir basin and smoothly connected channel bed, brown like the theory.
 const wallX=XI-28;
 const bedPath=`M ${XL} ${base+100} L ${wallX} ${base+100} L ${wallX} ${base+15} C ${wallX+5} ${base+3}, ${XI-10} ${base}, ${XI} ${base} L ${XR} ${bedY(90)}`;
 el('path',{d:bedPath+` L ${XR} ${YBOTTOM} L ${XL} ${YBOTTOM} Z`,
   fill:'#ae825d', 'fill-opacity':'.34',stroke:'none'});
 // Water fill is clipped to the reservoir basin and the channel bed.
 if(sol){
  const xx=sol.water_x||[],yy=sol.water_y||[];
  if(xx.length>1){
   const waterPts=xx.map((x,j)=>`${j?'L':'M'} ${xpix(x).toFixed(2)} ${(bedY(x)-yy[j]*headScale).toFixed(2)}`).join(' ');
   el('path',{d:waterPts+` L ${XR} ${bedY(90)} L ${XI} ${base} Z`,
      fill:'#55b8dc','fill-opacity':'.48',stroke:'none','pointer-events':'none'});
  }
 }
 el('path',{d:bedPath,fill:'none',stroke:'#79512f','stroke-opacity':'.66','stroke-width':5,'stroke-linejoin':'round'});
 // Decorative stones represent resistance, not a geometric change of the bed.
 // Lower Strickler Kₛ means higher roughness and larger stones.
 const rough=clamp((110-Number(args.ks||65))/85,0,1);
 const rockSize=2.0+rough*10.5;
 const rockCount=rough>.72?32:rough>.35?40:48;
 for(let j=0;j<rockCount;j++){
   const f=(j+.42+.12*Math.sin(j*4.19))/(rockCount+.2);
   const px=XI+f*(XR-XI),py=bedY(90*f);
   const r=rockSize*(.72+.28*(.5+.5*Math.sin(j*12.9898)));
   const cy=py-r*.32;
   const pts=[
     [px-r*.94,cy+r*.36],[px-r*.76,cy-r*.45],
     [px-r*.20,cy-r*.86],[px+r*.47,cy-r*.68],
     [px+r*.96,cy+r*.24],[px+r*.30,cy+r*.57]
   ].map(v=>v.map(n=>n.toFixed(2)).join(',')).join(' ');
   el('polygon',{points:pts,fill:j%3===0?'#82766a':j%3===1?'#9a8a7b':'#766b60',
      stroke:'#65594d','stroke-width':'.75',opacity:'.92','pointer-events':'none'});
   el('path',{d:`M ${px-r*.58} ${cy-r*.35} L ${px-r*.13} ${cy-r*.62} L ${px+r*.22} ${cy-r*.49}`,
      stroke:'#c7b6a3','stroke-width':'.9',fill:'none','stroke-opacity':'.65','pointer-events':'none'});
 }
 el('path',{d:`M ${XL} ${waterY} L ${XA} ${waterY}`,fill:'none',stroke:'#168bc4','stroke-width':4});
 const dep=sol?(sol.winner==='Steep'?sol.k:sol.h0):H*.75;
 const intakeY=base-dep*headScale;
 el('path',{d:`M ${XA} ${waterY} C ${XA+50} ${waterY}, ${XI-40} ${intakeY}, ${XI} ${intakeY}`,fill:'none',stroke:'#168bc4','stroke-width':3,'stroke-dasharray':'9 7'});
 if(sol){
  const k=Number(sol.k),h0=Number(sol.h0);
  el('path',{d:`M ${XI} ${base-k*headScale} L ${XR} ${bedY(90)-k*headScale}`,fill:'none',stroke:'#d43b44','stroke-width':2.7,'stroke-dasharray':'10 7'});
  el('path',{d:`M ${XI} ${base-h0*headScale} L ${XR} ${bedY(90)-h0*headScale}`,fill:'none',stroke:'#238b57','stroke-width':2.7,'stroke-dasharray':'3 7'});
  const xx=sol.water_x||[],yy=sol.water_y||[];
  if(xx.length>1){const d=xx.map((x,j)=>`${j?'L':'M'} ${xpix(x).toFixed(2)} ${(bedY(x)-yy[j]*headScale).toFixed(2)}`).join(' ');el('path',{d,fill:'none',stroke:'#168bc4','stroke-width':2.2});}
  if(sol.winner==='Steep')el('circle',{cx:XI,cy:base-k*headScale,r:8,fill:'white',stroke:'#d43b44','stroke-width':3});
  else el('circle',{cx:XR,cy:bedY(90)-h0*headScale,r:8,fill:'white',stroke:'#238b57','stroke-width':3});
 }
 // Energy head vertical dimension line, with arrowheads.
 el('line',{x1:72,x2:72,y1:base,y2:waterY,stroke:'#344054','stroke-width':2});
 el('path',{d:`M 66 ${waterY+9} L 72 ${waterY} L 78 ${waterY+9} M 66 ${base-9} L 72 ${base} L 78 ${base-9}`,fill:'none',stroke:'#344054','stroke-width':2});
 el('text',{x:80,y:(base+waterY)/2,class:'tag',fill:'#344054'},`H₀ = ${fmt(H,2)} m`);
 el('text',{x:(XA+XI)/2,y:YTOP+30,'text-anchor':'middle',class:'tag',fill:'#168bc4'},'Qualitative!');
 el('text',{x:XI+(XR-XI)/2,y:504,'text-anchor':'middle',
   class:'slope-label'},
   sol?(sol.winner.toUpperCase()+' SLOPE'):'CHANNEL SLOPE');
 el('text',{x:XL,y:24,class:'note'},'Reservoir: V ≈ 0');
 el('text',{x:XR,y:24,'text-anchor':'end',class:'note'},`i = ${fmt(s,6)} m/m  (${fmt(100*s,3)}%)`);
 el('text',{x:XR,y:525,'text-anchor':'end',class:'note'},'Blue: water surface · Green dotted: normal · Red dashed: critical');
 // Consistent educational profile labels, as in Module 05.
 if(sol){
  const xx=sol.water_x||[], yy=sol.water_y||[];
  if(xx.length>3){
   const j=Math.max(1,Math.min(xx.length-2,Math.floor(xx.length*.46)));
   const depth=Number(yy[j]), k=Number(sol.k), h0=Number(sol.h0);
   // A constant numerical depth equal to h₀ is uniform flow, not M2.
   const uniform=yy.every(v=>Math.abs(Number(v)-h0)<=Math.max(1e-8,1e-6*h0));
   const profile=uniform?'Uniform flow':sol.winner==='Mild'?
     (depth>h0*1.02?'M1':depth>k*1.02?'M2':'M3'):
     (depth>k*1.02?'S1':depth>h0*1.02?'S2':'S3');
   el('text',{x:xpix(xx[j]),y:bedY(xx[j])-depth*headScale-16,
      'text-anchor':'middle',class:'tag',fill:'#075b93'},profile);
  }
 }
 // Head dragger sits on the reservoir surface, slope dragger on the right bed endpoint.
 el('circle',{cx:115,cy:waterY,r:13,class:'head-handle','data-handle':'head'});
 el('text',{x:117,y:waterY-20,'text-anchor':'middle',class:'tag',fill:'#168bc4','pointer-events':'none'},'DRAG H₀');
 el('circle',{cx:XR,cy:bedY(90),r:13,class:'handle','data-handle':'slope'});
 el('text',{x:XR-16,y:bedY(90)-23,'text-anchor':'end',class:'tag',fill:'#85542d','pointer-events':'none'},'DRAG i');
 if(args.error)el('text',{x:350,y:55,class:'tag',fill:'#b72d35'},'Adjust handles: hydraulic solution unavailable');
}
function yLocal(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()).y:0}
function adjust(e){if(!active)return;const y=yLocal(e);if(active==='head')localH=clamp((306-y)/52,.65,5);
 else{const drop=clamp(y-306,18,120);const frac=(drop-18)/102;localS=clamp(.00005*Math.pow(800,frac),.00005,.04)}draw()}
svg.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-handle]');if(!h)return;active=h.dataset.handle;svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',adjust);
svg.addEventListener('pointerup',e=>{if(!active)return;adjust(e);active=null;send('streamlit:setComponentValue',{value:{H0:localH,slope:localS,revision:++revision},dataType:'json'})});
svg.addEventListener('pointercancel',()=>{active=null});
window.addEventListener('message',e=>{if(e.data?.type!=='streamlit:render')return;args=e.data.args||{};if(!active){localH=Number(args.H0)||2.4;localS=Number(args.slope)||.0015}draw();send('streamlit:setFrameHeight',{height:Math.ceil(svg.getBoundingClientRect().height)+12})});
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:Math.ceil(svg.getBoundingClientRect().height)+12});
window.addEventListener('resize',()=>send('streamlit:setFrameHeight',{height:Math.ceil(svg.getBoundingClientRect().height)+12}));
</script></body></html>
